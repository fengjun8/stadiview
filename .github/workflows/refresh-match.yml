name: Refresh match card

# The upcoming-match card and the Tickets list are generated from the venue's
# own published listings, so they only move when this runs. 12:17 UTC is
# 08:17/09:17 in East Rutherford: after the night's reseeding, before the
# morning traffic.

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, and a base-image
    # swap is the last thing a fetch-and-commit job should discover on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Both feeds sit behind CDN edge nodes that some runner IPs reach slower (or
      # not at all) over AAAA records; pin Node to A-first so a stall becomes a
      # logged HTTP status instead of a silent 25s abort per fetch.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the two feeds are reachable from this runner
        run: |
          for u in https://www.metlifestadium.com/events \
                   https://www.tickpick.com/venues/metlife-stadium/tickets/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 25 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' "$u" || echo ERR)
            echo "$u -> $code"
          done

      - name: Fetch the venue feeds
        run: node scripts/refresh-match.mjs

      - name: Commit the new snapshot
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing moved since the last run."
            exit 0
          fi
          git config user.name "match-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/match.json index.html
          git commit -m "Refresh the match card from the venue feed ($(date -u +%F))"
          git push origin HEAD:"${GITHUB_REF_NAME}"
